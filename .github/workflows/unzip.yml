name: Extract project zip
on:
  push:
    paths:
      - tastelens-clean.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip to repository root
        run: |
          rm -rf __extract
          mkdir __extract
          unzip -o tastelens-clean.zip -d __extract
          rm -rf __extract/__MACOSX
          entries=$(find __extract -mindepth 1 -maxdepth 1 | wc -l)
          top=$(find __extract -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ "$entries" -eq 1 ] && [ -n "$top" ] && [ -f "$top/render.yaml" ]; then
            cp -a "$top"/. .
          else
            cp -a __extract/. .
          fi
          rm -rf __extract __MACOSX
          rm -f tastelens-clean.zip
          rm -f .github/workflows/unzip.yml
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Extract project files"
            git push
          fi
